enums:
  ServiceType:
    title: Service type
    description: What the contractor sells
    in_subset:
    - reference
    permissible_values:
      Drinking water operations: {}
      Wastewater operations: {}
      Parks and open space maintenance: {}
      Resource recovery operations: {}
      Roading maintenance: {}
      Civil construction: {}
      Surveying and design: {}
      Electrical and building services: {}
    annotations:
      owner_role: Commercial manager
  WorkType:
    title: Work type
    description: How the work arises
    in_subset:
    - reference
    permissible_values:
      Planned (cyclic): {}
      Reactive: {}
      Emergency: {}
      Capital: {}
    annotations:
      owner_role: Division operations managers
  AssetClass:
    title: Asset class
    description: What the infrastructure is (owner's classification)
    in_subset:
    - reference
    annotations:
      owner_role: Asset & GIS lead
      note: >-
        Adopt the asset owner's scheme (national three waters asset metadata standards, RAMM for roads)
        rather than inventing one.
  MaterialStream:
    title: Material stream
    description: What the material is, for diversion reporting
    in_subset:
    - reference
    permissible_values:
      Refuse: {}
      Green waste: {}
      Recycling: {}
      Hardfill: {}
      Hazardous: {}
    annotations:
      owner_role: Resource recovery manager
  CostType:
    title: Cost type
    description: Nature of the cost
    in_subset:
    - reference
    permissible_values:
      Labour: {}
      Plant: {}
      Materials: {}
      Subcontract: {}
      Overhead: {}
    annotations:
      owner_role: Finance
  TerritorialArea:
    title: Territorial area
    description: Statutory district (Stats NZ codes)
    in_subset:
    - reference
    annotations:
      owner_role: Data governance group
      note: Values are Stats NZ territorial authorities; each client lists the ones it works in.
