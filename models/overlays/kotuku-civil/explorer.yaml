concept_overrides:
  Organisation:
    examples:
    - Kōtuku District Council
    - Kōtuku Water Limited
    - Tarapuka District Council
    - Taumata Arowai
    - NZ Transport Agency Waka Kotahi
  Person:
    examples:
    - a water treatment operator
    - a subcontractor traffic controller
    - a council contract manager
  OrganisationalUnit:
    examples:
    - Water Services & Parks
    - Construction
    - Roading
    - Electrical & Building
    semantic_change: >-
      Units are renamed and merged over time. Keep effective-from and effective-to dates so history still
      rolls up.
  Tender:
    examples:
    - Riverside cycleway stage two tender
  Contract:
    examples:
    - Tarapuka roading maintenance contract
    - Kōtuku township wastewater renewal contract
    - Harakeke District services contract
  ScheduleItem:
    examples:
    - mow reserve grass per 1000 m²
    - weekly treatment plant compliance visit
    - supply and lay 150 mm PE main per metre
  Project:
    examples:
    - Kōtuku township wastewater renewal
    - Riverside cycleway stage one
  InfrastructureAsset:
    examples:
    - a Kōtuku water treatment plant
    - a 150 mm water main
    - a playground
    - a section of sealed road
    - a bore pump
    non_examples:
    - Kōtuku Civil's utes, mowers and excavators (Plant item)
    semantic_change: >-
      Kōtuku drinking water and wastewater assets changed owner on 1 July 2026. Ownership is time-bounded
      (see relation R29).
  InfrastructureSystem:
    examples:
    - the Kōtuku township drinking water supply scheme
    - the Kōtuku township wastewater scheme
    - Tarapuka district road network
  Material:
    examples:
    - chlorine
    - PE pipe
    - aggregate
    - line-marking paint
  Competency:
    examples:
    - drinking water treatment operator qualification
    - temporary traffic management
    - confined space entry
    - electrical registration
  Obligation:
    examples:
    - >-
      drinking water sampling at a supply at the frequency set in the Drinking Water Quality Assurance
      Rules
    - a resource consent discharge monitoring condition
    - a contract response time for urgent faults
  MaterialMovement:
    examples:
    - green waste delivered to a council transfer station
  AssetOwnership:
    examples:
    - >-
      Kōtuku District Council owned the Kōtuku water treatment plant until 30 June 2026; Kōtuku Water
      Limited from 1 July 2026.
  PaymentSchedule:
    examples:
    - A council's response to Kōtuku Civil's monthly roading maintenance claim.
dilemmas:
- id: D5
  title: Asset ownership — attribute or time-bounded relation?
  context: >-
    Kōtuku drinking water and wastewater assets moved from the council to Kōtuku Water Limited on 1 July
    2026; stormwater did not.
  options:
  - name: Current owner as an attribute on the asset
    commits: Only today's truth.
    consequence: Restated history; revenue and work before the transfer appears to be for the new owner.
  - name: Ownership as a relation with valid-from and valid-to
    commits: An ownership history table and rule RU2.
    consequence: Correct as-at reporting either side of the transfer.
  deciding_questions:
  - Will anyone report across the transfer date? (Yes — annual reports and shareholder reporting.)
  recommendation: Time-bounded relation. Apply the same pattern to contract client (R01) and crew membership.
  conditions: None.
open_questions:
- id: Q1
  owner: Commercial manager
  q: >-
    Since 1 July 2026 is the Kōtuku water services contract held with Kōtuku Water Limited, Kōtuku District
    Council, or both (stormwater stayed with the council)?
- id: Q2
  owner: Finance
  q: How do job numbers relate to contracts, projects and work orders in each division?
- id: Q3
  owner: Division operations managers
  q: Where do work orders live — in Kōtuku Civil's systems, the client's, or both?
- id: Q4
  owner: Commercial manager
  q: Are small-works purchase orders from clients managed as contracts?
- id: Q5
  owner: Asset & GIS lead
  q: >-
    Does Kōtuku Civil keep its own copy of client asset data (RAMM, council asset systems) or read it
    at source?
- id: Q6
  owner: Division operations managers
  q: Are crews fixed teams or daily allocations in each division?
- id: Q7
  owner: Operations and commercial
  q: Which "completed" date does each contract KPI use?
- id: Q8
  owner: Finance
  q: >-
    Where Kōtuku Civil runs a facility for a council, who does the gate or user charge revenue belong
    to?
