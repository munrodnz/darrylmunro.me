# Kōtuku Civil — overlay narrative for the model explorer. FICTIONAL organisation.
# concept_overrides adds client-specific examples and notes to pack concepts;
# those fields are shown with the client tag in the explorer.

client: Kōtuku Civil
meta:
  model: Kōtuku Civil Conceptual Data Model
  organisation_name: Kōtuku Civil
  status: Worked example — fictional organisation
  as_of: '2026-10-28'
  prepared_by: Darryl Munro
  basis: >-
    A fictional council-controlled contractor, Kōtuku Civil, used to show how the NZ infrastructure contractor
    pack and a client overlay work together. Every organisation, place, project and date in the overlay
    is invented. The pack itself is general and reusable.
  sources:
  - title: Databricks Lakehouse Industry Data Models (GitHub)
    url: https://github.com/databricks-industry-solutions/lakehouse-industry-data-models
  short: Kōtuku Civil CDM
purpose:
  statement: >-
    Give Kōtuku Civil's divisions, finance and the data platform one explicit, shared set of meanings
    for the things the company does work on, for and with, so that reports, lakehouse tables and AI assistants
    answer the same question the same way.
  consumers:
  - Data platform team deriving lakehouse silver tables, keys and tags
  - Genie spaces and agents answering natural-language questions (context layer)
  - Division managers, contract managers and finance using cross-division reporting
  - Executive team and board, for strategy and performance reporting
  failure_looks_like:
  - '"Asset" counts mix client water mains with Kōtuku Civil''s own utes and mowers'
  - '"Customer" counts ratepayers or facility users as clients'
  - Water revenue attributed to the wrong owner either side of the 1 July 2026 transfer
  - A Genie answer about "jobs" counts finance job numbers when the person meant work orders
  - >-
    A compliance obligation reported as met because the work order closed, not because the check was done
assumptions:
- id: A1
  text: >-
    Kōtuku Civil is an operator and contractor, not a utility. It does not own the networks it operates
    and does not bill households. Treating it as a "utility" imports the wrong core concepts (customer
    account, meter, tariff, bill).
- id: A2
  text: >-
    Kōtuku drinking water and wastewater assets moved from Kōtuku District Council to Kōtuku Water Limited
    on 1 July 2026. Whether the water services contract counterparty changed at the same time is not confirmed.
- id: A3
  text: >-
    Divisions run their own operational systems; finance runs one ERP with job costing. Assumed for this
    example.
- id: A4
  text: >-
    For this example, the first technical consumer is a Databricks lakehouse with Genie. Power BI may
    also consume the same definitions.
context:
  centre:
    name: Kōtuku Civil Limited
    note: >-
      Fictional council-controlled contractor owned by Kōtuku District Council. Water services, parks,
      roading, construction and electrical work across three districts.
  groups:
  - id: shareholder
    name: Shareholder
    flow: Ownership, dividend, statement of intent
    parties:
    - Kōtuku District Council
  - id: clients
    name: Clients
    flow: Contracts in, claims and reporting out
    parties:
    - Kōtuku District Council
    - Kōtuku Water Limited (to confirm — Q1)
    - Tarapuka District Council
    - Harakeke District Council
    - NZ Transport Agency Waka Kotahi (prequalified)
    - Developers and private clients
  - id: owners
    name: Asset owners
    flow: Own the infrastructure Kōtuku Civil builds, operates and maintains
    parties:
    - Kōtuku Water Limited (drinking water and wastewater, from 1 July 2026)
    - District councils (stormwater, parks, roads)
    - NZTA (state highways)
  - id: regulators
    name: Regulators
    flow: Rules, consents, audits
    parties:
    - Taumata Arowai (drinking water)
    - The regional council (resource consents)
    - WorkSafe (health and safety)
  - id: suppliers
    name: Suppliers & subcontractors
    flow: Materials, plant hire, specialist labour
    parties:
    - Subcontractors
    - Material suppliers
    - Plant hire firms
    - Laboratories
  - id: public
    name: Communities
    flow: Requests through councils; use of parks, water services and council facilities
    parties:
    - Residents and ratepayers
    - Transfer station users
